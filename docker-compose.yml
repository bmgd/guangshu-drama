services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: guangshu
      POSTGRES_PASSWORD: guangshu
      POSTGRES_DB: guangshu_drama
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guangshu -d guangshu_drama"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  guangshu-drama:
    build: .
    ports:
      - "5679:5679"
    volumes:
      - ./data:/app/data
      - ./backend/workspace:/app/backend/workspace
    environment:
      - NODE_ENV=production
      - PORT=5679
      - DATABASE_URL=postgres://guangshu:guangshu@postgres:5432/guangshu_drama
      - STORAGE_PATH=/app/data/static
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5679/api/v1/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
